name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PRD §9: one CI job per acceptance criterion, ac-1 … ac-12, each exiting 0/non-zero, all
# required for merge to main. ac-11 (package-identity publish gate) lives in publish.yml.
# ac-5 (didcomm behavior-parity diff) has been retired — see the note where it used to sit, below.
#
# The build-test job is the comprehensive gate: it builds the whole solution with
# warnings-as-errors — which is itself the AC-6 banned-symbol scan (BannedApiAnalyzers) and the
# AC-7 PublicApiAnalyzer surface gate at compile time — and runs every test. The ac-* jobs below
# pin each individual criterion to its specific tests or tooling so a regression names the exact
# criterion it broke.

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DataProofsDotnet.sln
      - name: Build (warnings as errors — NFR-1; AC-6 banned-symbol + AC-7 analyzer gate)
        run: dotnet build DataProofsDotnet.sln --configuration Release --no-restore /warnaserror
      - name: Test
        run: dotnet test DataProofsDotnet.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**/test-results.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  ac-1:
    name: ac-1 cryptosuite conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DataProofsDotnet.sln
      # JCS suites + controller authorization + proof sets/chains (Core); RDFC suites + bbs-2023
      # lifecycle (Rdfc). Live bbs-2023 tests run where NetCrypto's BBS native assets are present
      # and otherwise self-skip per the documented capability model (PRD FR-12 / §12.3); the
      # BbsAbsent capability tests always run.
      - name: ac-1 Core (JCS + controller-auth + sets/chains)
        run: dotnet test tests/DataProofsDotnet.Core.Tests/DataProofsDotnet.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~DataProofsDotnet.Core.Tests.W3c|FullyQualifiedName~DataProofsDotnet.Core.Tests.Constructed"
      - name: ac-1 Rdfc (RDFC suites + bbs-2023 lifecycle)
        run: dotnet test tests/DataProofsDotnet.Rdfc.Tests/DataProofsDotnet.Rdfc.Tests.csproj --configuration Release --filter "FullyQualifiedName~RdfcSuiteVectorTests|FullyQualifiedName~Bbs2023"

  ac-2:
    name: ac-2 RDFC-1.0 canonicalizer conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: ac-2 rdf-canon manifest suite
        run: dotnet test tests/DataProofsDotnet.Rdfc.Tests/DataProofsDotnet.Rdfc.Tests.csproj --configuration Release --filter "FullyQualifiedName~RdfCanonicalizationConformanceTests"

  ac-3:
    name: ac-3 JOSE / SD-JWT / SD-JWT VC / VC-JOSE-COSE (JOSE half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # All Jose conformance + oracle cross-verification + SD-JWT/VC + VcJose, including the ported
      # didcomm parity test suite (intermixed in these namespaces) as standard JOSE coverage.
      - name: ac-3 Jose conformance + oracle + SD-JWT(/VC) + VcJose
        run: dotnet test tests/DataProofsDotnet.Jose.Tests/DataProofsDotnet.Jose.Tests.csproj --configuration Release

  ac-4:
    name: ac-4 COSE / CWT / VC-JOSE-COSE (COSE half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: ac-4 Cose suite
        run: dotnet test tests/DataProofsDotnet.Cose.Tests/DataProofsDotnet.Cose.Tests.csproj --configuration Release

  # ac-5 (didcomm JWS/JWE behavior-parity diff) was retired: it pinned the ported JOSE tests to a
  # didcomm-dotnet source SHA, which becomes meaningless once didcomm-dotnet is refactored. The
  # ported parity TEST suite is kept and still runs under ac-3 (and build-test) as standard JOSE
  # coverage; only the source-diff gate and its tooling were removed.

  ac-6:
    name: ac-6 dependency hygiene + NetCrypto-only crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The banned-symbol scan is enforced at compile time by BannedApiAnalyzers under /warnaserror.
      - name: Build src with banned-symbol analyzer (AC-6 banned symbols)
        run: dotnet build DataProofsDotnet.sln --configuration Release /warnaserror
      - name: ac-6 dependency-hygiene tool (project + packed graphs)
        run: dotnet run --project tasks/dependency-hygiene --configuration Release --no-build
      - name: ac-6 reflection hygiene gates
        run: dotnet test tests/DataProofsDotnet.ApiSurface.Tests/DataProofsDotnet.ApiSurface.Tests.csproj --configuration Release --no-build

  ac-7:
    name: ac-7 public-API surface discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # PublicApiAnalyzers fail the build on any undeclared public API under /warnaserror.
      - name: Build (PublicApiAnalyzer surface gate)
        run: dotnet build DataProofsDotnet.sln --configuration Release /warnaserror
      - name: ac-7 api-surface-scan (positive allowlist)
        run: dotnet run --project tasks/api-surface-scan --configuration Release --no-build
      - name: ac-7 reflection surface gates
        run: dotnet test tests/DataProofsDotnet.ApiSurface.Tests/DataProofsDotnet.ApiSurface.Tests.csproj --configuration Release --no-build

  ac-8:
    name: ac-8 no-key-surrender property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: ac-8 key-store signing access confined to signing-only members
        run: dotnet test tests/DataProofsDotnet.Core.Tests/DataProofsDotnet.Core.Tests.csproj --configuration Release --filter "FullyQualifiedName~KeyStoreSigning"

  ac-9:
    name: ac-9 samples coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (samples + tooling)
        run: dotnet build DataProofsDotnet.sln --configuration Release /warnaserror
      - name: ac-9 samples-coverage (100% non-allowlisted public surface)
        run: dotnet run --project tasks/samples-coverage --configuration Release --no-build
      - name: ac-9 every sample runs to exit 0
        shell: bash
        run: |
          set -euo pipefail
          for proj in samples/DataProofsDotnet.Samples.*/; do
            echo "=== ${proj} ==="
            dotnet run --project "${proj}" --configuration Release --no-build
          done

  ac-10:
    name: ac-10 pack, install, and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack all five packages to a local feed
        run: dotnet pack DataProofsDotnet.sln --configuration Release --output ./local-feed
      - name: ac-10 clean-room install + smoke per package
        shell: bash
        run: |
          set -euo pipefail
          feed="$(pwd)/local-feed"
          # Derive the version from the packed Core nupkg so the smoke install always matches what
          # was actually packed (e.g. the -preview suffix from $(DataProofsVersion)); never hardcode.
          version="$(basename "$(ls "$feed"/DataProofsDotnet.Core.*.nupkg | head -1)" .nupkg | sed 's/^DataProofsDotnet\.Core\.//')"
          echo "smoke-testing packages at version: $version"
          # Register the local pack feed once in the user NuGet config (shared by every iteration's
          # restore). Adding it inside the loop would fail on the 2nd package with "source
          # 'local-feed' already exists".
          dotnet nuget add source "$feed" --name local-feed
          declare -A smoke=(
            [DataProofsDotnet.Core]=tasks/smoke/Core
            [DataProofsDotnet.Jose]=tasks/smoke/Jose
            [DataProofsDotnet.Cose]=tasks/smoke/Cose
            [DataProofsDotnet.Rdfc]=tasks/smoke/Rdfc
            [DataProofsDotnet.Extensions.DependencyInjection]=tasks/smoke/DependencyInjection
          )
          # Documented per-package prerequisite (tasks/smoke/README.md): the only extra package a
          # clean-room install may add. The NetCrypto signer substrate flows transitively, so only
          # the DI smoke needs one — the concrete Microsoft.Extensions.DependencyInjection container
          # (the package surfaces only its Abstractions). Pinned to the abstractions' version.
          declare -A prereq=(
            [DataProofsDotnet.Extensions.DependencyInjection]="Microsoft.Extensions.DependencyInjection:10.0.8"
          )
          for id in "${!smoke[@]}"; do
            echo "=== clean-room install + smoke: ${id} ==="
            tmp="$(mktemp -d)"
            ( cd "$tmp" && dotnet new console -n SmokeApp >/dev/null )
            cp "${smoke[$id]}/Program.cs" "$tmp/SmokeApp/Program.cs"
            ( cd "$tmp/SmokeApp" \
              && dotnet add package "$id" --version "$version" --source "$feed" \
              && { [ -z "${prereq[$id]:-}" ] || dotnet add package "${prereq[$id]%%:*}" --version "${prereq[$id]##*:}"; } \
              && dotnet run -c Release )
          done

  ac-12:
    name: ac-12 native AOT publish + JIT parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The runner context is not available to job-level env, so the scratch path is exported here.
      - name: Scratch directory for the three reports
        run: echo "SMOKE=$RUNNER_TEMP/aot-smoke" >> "$GITHUB_ENV"
      - name: Native toolchain for the ILCompiler
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # NFR-7 / AC-12 (issue #27). tasks/aot-smoke exercises every package with fixed keys and timestamps
      # and writes a report whose `deterministic` section must be byte-identical across three runtimes.
      # Each run builds into its own output directory and is checked for the runtime it claims to be,
      # so a mix-up between the three cannot pass silently. PublishAot is passed on the command line,
      # not set in the csproj, so ordinary solution restores never download the ILCompiler and
      # `dotnet run` stays a true JIT baseline (see tasks/aot-smoke/README.md).
      - name: emit — JIT, reflection-based serialization enabled (today's ordinary host)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE"
          dotnet build tasks/aot-smoke/AotSmoke.csproj --configuration Release /warnaserror -o "$SMOKE/jit"
          dotnet "$SMOKE/jit/AotSmoke.dll" emit "$SMOKE/jit.json"
          jq -e '.runtime.reflectionEnabled == true and .runtime.isDynamicCodeSupported == true' "$SMOKE/jit.json" > /dev/null
      - name: emit — JIT with reflection-based serialization disabled (trimmed-host / .NET 10 file-based-app condition)
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tasks/aot-smoke/AotSmoke.csproj --configuration Release --no-incremental -p:JsonSerializerIsReflectionEnabledByDefault=false -o "$SMOKE/noreflect"
          dotnet "$SMOKE/noreflect/AotSmoke.dll" emit "$SMOKE/trimmed.json"
          jq -e '.runtime.reflectionEnabled == false' "$SMOKE/trimmed.json" > /dev/null
      - name: publish — native AOT, linux-x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tasks/aot-smoke/AotSmoke.csproj --configuration Release -r linux-x64 -p:PublishAot=true -o "$SMOKE/aot" 2>&1 | tee "$SMOKE/publish.log"
      - name: emit — native binary
        shell: bash
        run: |
          set -euo pipefail
          "$SMOKE/aot/AotSmoke" emit "$SMOKE/aot.json"
          jq -e '.runtime.isDynamicCodeSupported == false and .runtime.reflectionEnabled == false and .runtime.bbsAvailable == true' "$SMOKE/aot.json" > /dev/null
      - name: compare — deterministic output byte-identical across JIT, reflection-disabled JIT and native AOT
        run: dotnet "$SMOKE/jit/AotSmoke.dll" compare "$SMOKE/jit.json" "$SMOKE/trimmed.json" "$SMOKE/aot.json"
      - name: cross-verify — the native binary verifies the JIT run's artifacts, and JIT verifies the native run's
        shell: bash
        run: |
          set -euo pipefail
          "$SMOKE/aot/AotSmoke" verify "$SMOKE/jit.json"
          dotnet "$SMOKE/jit/AotSmoke.dll" verify "$SMOKE/aot.json"
          dotnet "$SMOKE/jit/AotSmoke.dll" verify "$SMOKE/trimmed.json"
      - name: No IL2xxx/IL3xxx warning attributed to a DataProofs assembly (positive control included)
        shell: bash
        run: |
          set -euo pipefail
          log="$SMOKE/publish.log"
          scan() { { grep -E 'IL[23][0-9]{3}' "$1" || true; } | { grep -E 'DataProofsDotnet|/src/' || true; }; }
          # Positive control: the scan must fire on a planted line, or a green result proves nothing.
          printf 'ILC : AOT analysis warning IL3050: DataProofsDotnet.Core.Planted(): control line\n' > "$SMOKE/control.log"
          [ -n "$(scan "$SMOKE/control.log")" ] || { echo "FAILED: the IL-warning scan did not fire on the planted control line"; exit 1; }
          echo "--- every IL warning in the publish log (third-party ones are informational) ---"
          { grep -E 'IL[23][0-9]{3}' "$log" || echo "(none)"; } | sort -u
          hits="$(scan "$log")"
          if [ -n "$hits" ]; then
            echo "FAILED: IL warnings attributed to DataProofsDotnet assemblies:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no IL2xxx/IL3xxx warning from a DataProofsDotnet assembly"
      - name: Upload reports and publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-smoke-reports
          path: |
            ${{ runner.temp }}/aot-smoke/*.json
            ${{ runner.temp }}/aot-smoke/publish.log
          if-no-files-found: warn

  # ac-11 (package identity & publish readiness) is the publish gate — see publish.yml.
